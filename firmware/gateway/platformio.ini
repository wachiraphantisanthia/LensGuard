; LensGuard gateway.
;   pio run -t upload               flash over USB
;   pio run -e gateway_ota -t upload   flash over Wi-Fi (E6); set OTA_PASSWORD in your shell first
;   pio device monitor              serial monitor (115200); prints MAC and Wi-Fi channel at boot
; Copy include/secrets.example.h to include/secrets.h and fill it in before building.

[env:gateway]
platform = espressif32@^6.9.0      ; Arduino-ESP32 core 2.x (the code also has #if for core 3.x)
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv   ; two ~1.9 MB app slots, needed for OTA with TLS + HTTP libs
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.9.0

[env:gateway_ota]
extends = env:gateway
upload_protocol = espota
upload_port = lensguard-gateway.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}
