; LensGuard sensor node. One codebase, two environments (box_A / box_B).
;   pio run -e box_a -t upload         build and flash box_A over USB
;   pio run -e box_b -t upload         build and flash box_B over USB
;   pio run -e box_a_ota -t upload     flash box_A over Wi-Fi (E6): jumper GPIO32-GND, reset, then upload
;   pio device monitor                 serial monitor (115200)
; Set GATEWAY_MAC and ESPNOW_CHANNEL in include/config.h first.
; For OTA: copy include/secrets.example.h to include/secrets.h and export OTA_PASSWORD in your shell.

[env]
platform = espressif32@^6.9.0      ; Arduino-ESP32 core 2.x (the code also has #if for core 3.x)
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^6.21.5

[env:box_a]
build_flags = -DNODE_ID=\"box_A\" -DNODE_HOST=\"lensguard-box-a\"

[env:box_b]
build_flags = -DNODE_ID=\"box_B\" -DNODE_HOST=\"lensguard-box-b\"

[env:box_a_ota]
extends = env:box_a
upload_protocol = espota
upload_port = lensguard-box-a.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}

[env:box_b_ota]
extends = env:box_b
upload_protocol = espota
upload_port = lensguard-box-b.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}
